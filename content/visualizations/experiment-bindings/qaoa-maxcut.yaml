id: experiment-visual-qaoa-maxcut
experiment: content/experiments/qaoa-maxcut.yaml
theme: content/visualizations/theme/nord-matte.yaml
panels:
  - type: circuit
    renderer: CircuitCanvas
    supportsSimulation: true
  - type: graph
    renderer: ProbabilityChart
    data: simulation.probabilities
  - type: codeRunner
    renderer: QiskitCodeRunner
    language: python
    sandbox: classroom-restricted
  - type: copilot
    renderer: CopilotPanel
    context: [experiment, circuit, latestResult, code]
